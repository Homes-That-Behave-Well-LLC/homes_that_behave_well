name: App

# Home Assistant App checks, following the official app guidance:
# - lint: the linter used by https://github.com/home-assistant/apps-example
# - build: "Plain Docker" build check for every declared architecture
#   (https://contributors.home-assistant.io/apps/guides/testing/)
#
# This workflow never pushes an image. Publishing prebuilt images to a container
# registry (and adding `image:` to config.yaml) is an Owner release decision; see
# docs/governance/home-assistant-quality.md.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: App lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Third-party linter (as used by home-assistant/apps-example), run from its pinned
      # release so one finding can be overridden: it calls `watchdog` obsolete, but the
      # official configuration reference
      # (https://contributors.home-assistant.io/apps/reference/configuration/) and the
      # Supervisor schema (supervisor/apps/validate.py) both accept it without any
      # deprecation, and official sources prevail. Every other finding fails the job.
      - name: Home Assistant App lint
        env:
          LINTER_REF: v2.21.2
        run: |
          git clone --quiet --depth 1 --branch "$LINTER_REF" \
            https://github.com/frenck/action-addon-linter "$RUNNER_TEMP/linter"
          docker build --quiet --tag local/app-linter "$RUNNER_TEMP/linter/src" > /dev/null
          docker run --rm -e INPUT_PATH=./apps/htbw_voice_evidence -e INPUT_COMMUNITY=false \
            -v "$PWD:/work:ro" -w /work local/app-linter \
            | sed "s/^::error\(.*'watchdog', is obsolete.*\)$/::notice\1 (overridden: official docs)/" \
            | tee "$RUNNER_TEMP/lint.txt" || true
          if grep '^::error' "$RUNNER_TEMP/lint.txt"; then
            exit 1
          fi

  build:
    name: Build ${{ matrix.arch }} (no push)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build the App image
        working-directory: apps/htbw_voice_evidence
        run: >-
          docker buildx build
          --platform ${{ matrix.platform }}
          --tag local/htbw-voice-evidence:${{ matrix.arch }}
          --load
          .

      - name: Check the packaged runtime imports
        run: >-
          docker run --rm --platform ${{ matrix.platform }}
          --entrypoint /opt/venv/bin/python
          --workdir /opt/htbw_voice_evidence
          local/htbw-voice-evidence:${{ matrix.arch }}
          -c "import htbw_voice_evidence.runtime, onnxruntime, numpy; print('ok')"
