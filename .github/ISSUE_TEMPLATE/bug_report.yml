name: Bug report
description: Report a problem with the BehavesWell Core integration or the BehavesWell Voice Evidence App.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include voice recordings, Voiceprints, secrets, tokens, or unredacted household
        or person identifiers. For a security problem, read SECURITY.md first and do not
        describe it here.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - HTBW Integration (installed from the Marketplace)
        - BehavesWell Voice Evidence App, formerly HTBW Voice Evidence (installed from Settings > Apps)
        - Both
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Home Assistant version, HTBW Integration version, and App version if installed.
      placeholder: "Home Assistant 2026.11.0, HTBW 0.2.0, App 0.1.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repairs
    attributes:
      label: Repairs and log messages
      description: Any HTBW Repairs issues shown under Settings > System > Repairs, and related log lines.
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Optional. Download diagnostics from the HTBW integration entry, review it, and attach it.
        HTBW redacts identifiers, but check the file before you share it.
